name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (CalVer: YYYY.M.patch, e.g., 2026.1.1)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - latest
          - beta
        default: latest

permissions:
  contents: read

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate CalVer format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Error: Version must be in CalVer format (YYYY.M.patch or YYYY.M.patch-beta.N)"
            echo "Examples: 2026.1.0, 2026.2.1, 2026.1.0-beta.1"
            exit 1
          fi

      - name: Verify Version Matches Repository
        env:
          VERSION: ${{ inputs.version }}
        run: |
          REPO_VERSION=$(node -p "require('./package.json').version")
          if [ "$REPO_VERSION" != "$VERSION" ]; then
            echo "Error: dispatched version ($VERSION) differs from package.json version ($REPO_VERSION)."
            echo "Commit the version bump to main first."
            exit 1
          fi

  release:
    needs: [validate]
    permissions:
      contents: write
      packages: write
      id-token: write
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup.outputs.node-version }}
      release-version: ${{ inputs.version }}
      release-channel: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Test Coverage
        run: pnpm run test:coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/backend/coverage/
            packages/frontend/coverage/
            packages/common/coverage/

      - name: Update Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pnpm -r --include-workspace-root exec npm pkg set "version=$VERSION"

      - name: Build
        run: pnpm run build

      - name: Package
        run: pnpm --filter home-assistant-matter-bridge run bundle

      - name: Generate Changelog
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Generate changelog from git commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" "$LAST_TAG"..HEAD)
          else
            COMMITS=$(git log --pretty=format:"* %s (%h)" -20)
          fi

          cat > CHANGELOG.md << EOF
          ## [$VERSION](https://github.com/$REPOSITORY/releases/tag/v$VERSION) ($(date +%Y-%m-%d))

          ### Changes

          $COMMITS
          EOF

          cat CHANGELOG.md

      - name: Create Git Tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file CHANGELOG.md \
            ${{ inputs.channel == 'beta' && '--prerelease' || '' }} \
            apps/home-assistant-matter-bridge/package.tgz \
            CHANGELOG.md

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package.tgz
          path: apps/home-assistant-matter-bridge/package.tgz

      - name: Upload Documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/_build/html"

  prepare-docker:
    name: "Prepare Docker"
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.dockerfiles.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Find Dockerfiles
        id: dockerfiles
        uses: ./.github/actions/find-dockerfiles

  docker:
    name: "Build Docker"
    runs-on: ubuntu-24.04-arm
    needs: [prepare-docker, release]
    permissions:
      packages: write
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.prepare-docker.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Package Artifact
        uses: actions/download-artifact@v8
        with:
          name: package.tgz
          path: apps/home-assistant-matter-bridge/
          merge-multiple: true

      - name: Build Docker
        uses: ./.github/actions/docker
        with:
          push: true
          channel: ${{ needs.release.outputs.release-channel }}
          dockerfile: ${{ matrix.dockerfile }}
          node-version: ${{ needs.release.outputs.node-version }}
          package-version: ${{ needs.release.outputs.release-version }}

  publish-pages:
    name: "Publish Documentation"
    runs-on: ubuntu-latest
    needs: [release]
    if: inputs.channel == 'latest'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy documentation to GitHub Pages
        uses: actions/deploy-pages@v5

  update-addon:
    name: "Update Add-on Version"
    runs-on: ubuntu-latest
    needs: [release, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Add-on Config
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$CHANNEL" = "latest" ]; then
            ADDON_DIR="hamb"
          else
            ADDON_DIR="hamb-beta"
          fi

          # Update version in config.yaml
          sed -i "s/^version: .*/version: \"$VERSION\"/" "$ADDON_DIR/config.yaml"

          # Update CHANGELOG
          cat > "$ADDON_DIR/CHANGELOG.md" << EOF
          ## [$VERSION](https://github.com/$REPOSITORY/releases/tag/v$VERSION) ($(date +%Y-%m-%d))

          See [GitHub Release](https://github.com/$REPOSITORY/releases/tag/v$VERSION) for details.
          EOF

      - name: Commit and Push
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$CHANNEL" = "latest" ]; then
            ADDON_DIR="hamb"
          else
            ADDON_DIR="hamb-beta"
          fi

          git add "$ADDON_DIR/config.yaml" "$ADDON_DIR/CHANGELOG.md"
          git diff --cached --quiet || git commit -m "chore(addon): update $ADDON_DIR to v$VERSION"
          git push
